<label class="omm-checkbox" [class.disabled]="disabled()">
    <span class="control">
        <input #input type="checkbox" [checked]="checked()" [disabled]="disabled()"
            [required]="required()" [attr.aria-label]="ariaLabel() || null"
            (change)="onToggle($event)" (blur)="onBlur()" />
        <lucide-icon class="mark" [img]="indeterminate() ? indeterminateIcon : checkIcon" [size]="14"
            [strokeWidth]="3" aria-hidden="true"></lucide-icon>
    </span>
    <span class="label"><ng-content></ng-content></span>
</label>
