<input type="text" [placeholder]="dateFormatPlaceholder"
    [value]="inputValue()" [disabled]="disabled()" (input)="onManualInput($event)" (blur)="onTouched()"
    autocomplete="off" />

<button #triggerButton type="button" class="icon"[disabled]="disabled()"
      (click)="toggleDialog()">
    <lucide-icon [img]="icon" [size]="18"></lucide-icon>
</button>

<dialog
  #calendarDialog
  aria-modal="true"
  class="app-datepicker-dialog"
  (close)="onDialogClose()"
  (click)="onDialogBackdropClick($event)"
>
  <omm-calendar
    [selectedDate]="selectedDate()"
    [initialFocusDate]="initialFocusDate()"
    [min]="min()"
    (dateSelected)="onDateSelected($event)"
  />
</dialog>
