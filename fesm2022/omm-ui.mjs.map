<dialog
    #dlg
    class="bottom-sheet"
    [attr.aria-label]="ariaLabel()"
    (close)="onClose()"
    (click)="onBackdropClick($event)">
    <div class="sheet">
        <div class="grabber" aria-hidden="true"></div>
        <div class="content">
            <ng-content></ng-content>
        </div>
    </div>
</dialog>
