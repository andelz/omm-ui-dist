<div class="button-toggle" role="group" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      [class.active]="value() === option.value"
      [attr.aria-pressed]="value() === option.value"
      [attr.aria-label]="option.ariaLabel ?? option.label"
      [title]="option.label"
      (click)="select(option)"
    >
      @if (option.icon) {
        <lucide-icon [img]="option.icon" [size]="iconSize()" />
      }
      <span>{{ option.label }}</span>
    </button>
  }
</div>
