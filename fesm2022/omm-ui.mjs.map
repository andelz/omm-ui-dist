<div class="pin-display" [class.verifying]="verifying()" aria-hidden="true">
  @for (i of slots(); track i) {
  <span class="pin-dot" [class.filled]="i < value().length" [style.--i]="i"></span>
  }
</div>

<div class="pin-keys">
  @for (k of keys; track k) {
  <button type="button" class="pin-key" (click)="press(k)" [disabled]="disabled()" [attr.aria-label]="k">
    {{ k }}
  </button>
  }
  <span class="pin-key-spacer" aria-hidden="true"></span>
  <button type="button" class="pin-key" (click)="press('0')" [disabled]="disabled()" aria-label="0">
    0
  </button>
  <button type="button" class="pin-key pin-backspace" (click)="backspace()" [disabled]="disabled()" aria-label="Delete">
    <lucide-icon [img]="resetIcon" [size]="32" />
  </button>
</div>
