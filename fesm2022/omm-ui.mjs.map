<div class="find-bar" role="search">
    <input #input
        type="text"
        [ngModel]="query()"
        (ngModelChange)="onInput($event)"
        (keydown)="onKeydown($event)"
        [attr.aria-label]="'omm.ui.pdf-viewer.find.placeholder' | translate"
        [placeholder]="'omm.ui.pdf-viewer.find.placeholder' | translate"
        [class.no-results]="noResults()" />
    <span class="count" aria-live="polite">
        @if (noResults()) {
            {{ 'omm.ui.pdf-viewer.find.no-results' | translate }}
        } @else {
            {{ countLabel() }}
        }
    </span>
    <button type="button" class="secondary"
        [disabled]="total() === 0"
        (click)="prev.emit()"
        [attr.aria-label]="'omm.ui.pdf-viewer.find.prev' | translate"
        [title]="'omm.ui.pdf-viewer.find.prev' | translate">
        <lucide-icon [img]="icon.prev" size="16"></lucide-icon>
    </button>
    <button type="button" class="secondary"
        [disabled]="total() === 0"
        (click)="next.emit()"
        [attr.aria-label]="'omm.ui.pdf-viewer.find.next' | translate"
        [title]="'omm.ui.pdf-viewer.find.next' | translate">
        <lucide-icon [img]="icon.next" size="16"></lucide-icon>
    </button>
    <button type="button" class="secondary"
        (click)="closed.emit()"
        [attr.aria-label]="'omm.ui.pdf-viewer.find.close' | translate"
        [title]="'omm.ui.pdf-viewer.find.close' | translate">
        <lucide-icon [img]="icon.close" size="16"></lucide-icon>
    </button>
</div>
