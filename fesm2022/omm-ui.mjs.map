<div class="toolbar">
    <!-- Page counter — mirrors Chrome's <viewer-page-selector> layout
         (spec §7). A real CVA-backed input is reserved for the Phase 3
         polish pass; v1 displays current/total only. -->
    @if (pageCount() > 0) {
        <span class="counter" aria-live="polite">{{ currentPage() }} / {{ pageCount() }}</span>
    }
    <span class="spacer"></span>
    <!-- Find button reserved for Phase 5 (find-bar wire-up); the
         (openFind) output is exposed but the trigger is not yet wired
         since the find-bar itself is not toggled on. -->
    <button type="button" class="secondary" (click)="zoomOut.emit()"
        [attr.aria-label]="'omm.ui.pdf-viewer.zoom-out' | translate"
        [title]="'omm.ui.pdf-viewer.zoom-out' | translate">
        <lucide-icon [img]="icon.zoomOut" size="18"></lucide-icon>
    </button>
    <span class="zoom" aria-live="polite">{{ zoomPercent() }}%</span>
    <button type="button" class="secondary" (click)="zoomIn.emit()"
        [attr.aria-label]="'omm.ui.pdf-viewer.zoom-in' | translate"
        [title]="'omm.ui.pdf-viewer.zoom-in' | translate">
        <lucide-icon [img]="icon.zoomIn" size="18"></lucide-icon>
    </button>
    <button type="button" class="secondary" [class.active]="fitActive()" (click)="fitToggle.emit()"
        [attr.aria-pressed]="fitActive()"
        [attr.aria-label]="'omm.ui.pdf-viewer.' + fitTitleKey() | translate"
        [title]="'omm.ui.pdf-viewer.' + fitTitleKey() | translate">
        <lucide-icon [img]="fitIcon()" size="18"></lucide-icon>
    </button>
</div>
