<omm-pdf-toolbar
    [zoomPercent]="zoomPercent()"
    [fittingType]="fittingType()"
    [currentPage]="currentPage()"
    [pageCount]="pageCount()"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (fitToggle)="cycleFitMode()"
    (openFind)="openFind()">
</omm-pdf-toolbar>
@if (findOpen()) {
    <omm-pdf-find-bar #findBar
        [query]="findQuery()"
        [current]="findIndex()"
        [total]="findResults().length"
        (queryChange)="onFindQueryChange($event)"
        (prev)="findPrev()"
        (next)="findNext()"
        (closed)="closeFind()">
    </omm-pdf-find-bar>
}
<div class="stage" #stage>
    @if (error(); as err) {
        <div class="message">{{ err }}</div>
    } @else {
        @if (!firstRendered()) {
            <div class="message">{{ 'omm.ui.pdf-viewer.loading' | translate }}</div>
        }
        <div class="pages-column" #pagesColumn [class.invisible]="!firstRendered()">
            @for (page of pages(); track page.index) {
                <div #pageEl class="page" role="region"
                    [attr.data-page-index]="page.index"
                    [style.width.px]="page.width"
                    [style.height.px]="page.height"
                    [attr.aria-label]="'omm.ui.pdf-viewer.page' | translate: { current: page.index + 1, total: pageCount() || 1 }">
                    <canvas></canvas>
                    <div class="text-layer"></div>
                </div>
            }
        </div>
    }
</div>
