<div class="app-calendar-header">
    <button type="button" aria-label="Previous Year" (click)="navigateYear(-1)"
        class="app-calendar-nav-btn">
    <lucide-icon [img]="icons.lefts" [size]="18"></lucide-icon>
    </button>
    <button type="button" aria-label="Previous Month" (click)="navigateMonth(-1)"
        class="app-calendar-nav-btn">
    <lucide-icon [img]="icons.left" [size]="18"></lucide-icon>
    </button>
    <h2 aria-live="polite" class="app-calendar-title">{{ monthYearLabel() }}</h2>
    <button type="button" aria-label="Next Month" (click)="navigateMonth(1)"
        class="app-calendar-nav-btn">
    <lucide-icon [img]="icons.right" [size]="18"></lucide-icon></button>
    <button type="button" aria-label="Next Year" (click)="navigateYear(1)" class="app-calendar-nav-btn">
        <lucide-icon [img]="icons.rights" [size]="18"></lucide-icon>
    </button>
</div>

<table role="grid" (keydown)="onGridKeydown($event)">
    <thead>
        <tr>
            @for (day of weekdayHeaders; track day.long) {
            <th scope="col" [abbr]="day.long">{{ day.narrow }}</th>
            }
        </tr>
    </thead>
    <tbody>
        @for (week of weeks(); track $index) {
        <tr>
            @for (day of week; track day.dateIso) {
            <td role="gridcell" [attr.tabindex]="day.isFocusTarget ? 0 : -1"
                [attr.aria-selected]="day.isSelected || null"
                [attr.aria-disabled]="day.isDisabled || day.isOutsideMonth || null" [attr.aria-label]="day.fullLabel"
                [class.today]="day.isToday" [class.selected]="day.isSelected" [class.outside-month]="day.isOutsideMonth"
                [class.disabled]="day.isDisabled" (click)="selectDate(day)">{{ day.dayNumber }}</td>
            }
        </tr>
        }
    </tbody>
</table>
