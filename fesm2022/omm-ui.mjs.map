
@let value = selectedValue();
<button #triggerButton type="button" [id]="triggerButtonId" class="select-trigger"
  [class.select-trigger--open]="isOpen()" [class.select-trigger--disabled]="disabled()"
  [class.select-trigger--has-value]="!!value" [disabled]="disabled()" [attr.aria-expanded]="isOpen()"
  [attr.aria-haspopup]="'listbox'" [attr.aria-controls]="listboxId" (click)="onTriggerClick()"
  (keydown)="onTriggerKeydown($event)">

  <span class="select-value" [class.select-value--placeholder]="!value">
    {{ displayValue() }}
  </span>



  <lucide-icon [img]="chevronIcon" [size]="18"></lucide-icon>

</button>

<dialog #dropdown [id]="dropdownId" class="select-dropdown" tabindex="-1"
  [attr.aria-labelledby]="triggerButtonId" (keydown.escape)="closeDropdown()">

  <div [id]="listboxId" class="select-options" role="listbox" (keydown)="onOptionKeydown($event)"
    [attr.aria-activedescendant]="highlightedIndex() >= 0 ? getOptionId(highlightedIndex()) : null">

    @if(options().length === 0){
    <div class="select-no-options">
      ...
    </div>
    }

    @for(item of options(); track $index){
    @let isSelected = item.value === selectedValue();
    <div class="select-option" [class.select-option--selected]="isSelected"
      [class.select-option--highlighted]="isOptionHighlighted($index)" [class.select-option--disabled]="item.disabled"
      role="option" [attr.aria-selected]="isSelected" [attr.aria-disabled]="item.disabled" tabindex="-1"
      (click)="onOptionClick(item, $event)">
      {{ item.label }}
    </div>
    }
  </div>
</dialog>
