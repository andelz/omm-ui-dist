<!-- autocomplete input for picking or adding new tags -->
<div ngCombobox focusMode="manual">
  <div class="autocomplete">
    <!-- input is first in DOM so a wrapping <label> binds to it, not to the first tag's remove button -->
    <input #origin (blur)="onBlur()" (keydown.backspace)="onBackspace()"
      [placeholder]="'omm.ui.tags-input.input.placeholder'|translate" (keydown.enter)="onEnter($event)"
      [(value)]="query" [disabled]="disabled()" aria-label="Add tags" enterkeyhint="done" ngComboboxInput />
    @for (tag of tags(); track $index) {
    <span class="tag">
      {{tag}}
      <button type="button" tabindex="-1" class="icon remove" (click)="removeTag($index)"
        [attr.aria-label]="'omm.ui.tags-input.tag.chip.aria-label.remove' | translate: ({tag})">
        <lucide-icon aria-hidden="true" [size]="14" [img]="tagRemoveIcon"></lucide-icon>
      </button>
    </span>
    }
  </div>
  <ng-template ngComboboxPopupContainer>
    <ng-template [cdkConnectedOverlay]="{origin, usePopover: 'inline', matchWidth: true}"
      [cdkConnectedOverlayOpen]="true">
      @if (tagSuggestions().length > 0) {
      <div class="popup">
        <div ngListbox>
          @for (tag of tagSuggestions(); track $index) {
          <!-- stopPropagation prevents ngCombobox's host click handler from running commit(),
               which would otherwise overwrite our just-cleared query via the [(value)] model -->
          <div ngOption [value]="tag" [label]="tag" (pointerdown)="$event.preventDefault()"
            (click)="addTag(tag); $event.stopPropagation()">
            <span class="option-label">{{ tag }}</span>
          </div>
          }
        </div>
      </div>
      }
    </ng-template>
  </ng-template>
</div>
