@let activeId_ = activeId() ?? flat()[0]?.node?.id;
@let selectedId_ = selectedId();
@let isEditable = editable();
@let lbls = labels();

<ul class="tree">
    @for (item of flat(); track item.node.id) {
    <li #row class="row" role="treeitem" [attr.data-id]="item.node.id" [attr.aria-level]="item.depth + 1"
        [attr.aria-expanded]="item.hasChildren ? item.expanded : null"
        [attr.aria-selected]="!isEditable ? selectedId_ === item.node.id : null"
        [attr.tabindex]="item.node.id === activeId_ ? 0 : -1" [style.--depth]="item.depth"
        (click)="onRowClick(item.node)">

        <span class="indent"></span>

        @if (item.hasChildren) {
            <span class="twisty">
                <button type="button" class="icon" tabindex="-1" (click)="toggleExpanded(item.node.id, $event)"
                [attr.aria-label]="item.expanded ? 'Collapse' : 'Expand'">
                <lucide-icon [img]="item.expanded ? chevronDownIcon : chevronRightIcon" [size]="18"></lucide-icon>
            </button>
        </span>
        } @else {
        <span class="twisty placeholder"></span>
        }

        @if (isEditable) {
        <input type="text" class="name-input" [value]="item.node.name" (click)="onNameClick(item.node, $event)"
            (focus)="onNameInputFocus(item.node.id)" (blur)="onNameInputCommit(item.node, $event)"
            (keydown)="onNameInputKeydown(item.node, $event)" />
        } @else {
        <button type="button" class="name-button" (click)="onNameClick(item.node, $event)">
            {{ item.node.name }}
        </button>
        }

        @if (isEditable) {
        <span class="actions">
            <button type="button" class="icon" tabindex="-1" (click)="onAddChild(item.node.id, $event)"
                [attr.aria-label]="lbls.addChild ?? 'Add child'">
                <lucide-icon [img]="addIcon" [size]="18"></lucide-icon>
            </button>
            <button type="button" class="icon" tabindex="-1" (click)="onDeleteClick(item.node)"
                [attr.aria-label]="lbls.delete ?? 'Delete'">
                <lucide-icon [img]="deleteIcon" [size]="18"></lucide-icon>
            </button>
        </span>
        }
    </li>
    }
</ul>
